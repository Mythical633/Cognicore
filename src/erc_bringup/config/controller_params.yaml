arm_left_controller:
  ros__parameters:
    joints:
      - arm_left_1_joint
      - arm_left_2_joint
      - arm_left_3_joint
      - arm_left_4_joint
      - arm_left_5_joint
      - arm_left_6_joint
      - arm_left_7_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]

arm_right_controller:
  ros__parameters:
    joints:
      - arm_right_1_joint
      - arm_right_2_joint
      - arm_right_3_joint
      - arm_right_4_joint
      - arm_right_5_joint
      - arm_right_6_joint
      - arm_right_7_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]

head_controller:
  ros__parameters:
    joints: [head_1_joint, head_2_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

torso_controller:
  ros__parameters:
    joints: [torso_lift_joint]
    command_interfaces: [position]
    state_interfaces: [position]

gripper_left_controller_raw:
  ros__parameters:
    joints: [gripper_left_finger_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

gripper_right_controller_raw:
  ros__parameters:
    joints: [gripper_right_finger_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
