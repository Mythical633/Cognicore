default_controllers:
  launch: "tiago_pro_controller_configuration default_controllers.launch.py
           arm_type_right:=@arm_type_right@
           arm_type_left:=@arm_type_left@
           end_effector_right:=@end_effector_right@
           end_effector_left:=@end_effector_left@
           ft_sensor_right:=@ft_sensor_right@
           ft_sensor_left:=@ft_sensor_left@
           ft_sensor_teleop_right:=@ft_sensor_teleop_right@
           ft_sensor_teleop_left:=@ft_sensor_teleop_left@
           torque_estimation:=@has_torque_estimation@
           has_teleop_arms:=@has_teleop_arms@
           wrist_model_right:=@wrist_model_right@
           wrist_model_left:=@wrist_model_left@"
  finishes: True
  dependencies: ["Hardware/Controller Manager/Hardware Components Activity"]
